<style>
        /* Base Animation Styles */
        @keyframes float {
            0% { transform: translateY(0px) scale(1); opacity: 0.8; }
            50% { transform: translateY(-20px) scale(1.05); opacity: 1; }
            100% { transform: translateY(0px) scale(1); opacity: 0.8; }
        }
        
        @keyframes breathe-sun {
            0% { transform: scale(1) translate(-50%, -50%); box-shadow: 0 0 40px rgba(253, 168, 159, 0.4); }
            50% { transform: scale(1.05) translate(-48%, -48%); box-shadow: 0 0 80px rgba(255, 222, 167, 0.6); }
            100% { transform: scale(1) translate(-50%, -50%); box-shadow: 0 0 40px rgba(253, 168, 159, 0.4); }
        }

        @keyframes drift {
            0% { transform: translateX(0); }
            100% { transform: translateX(50vw); }
        }

        @keyframes sparkle-twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes reveal-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes halo-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Ambient Background Mesh */
        .ambient-mesh {
            background-color: #fff8f7;
            background-image: 
                radial-gradient(at 40% 20%, hsla(28,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(355,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 80% 50%, hsla(340,100%,76%,1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(22,100%,77%,1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(242,100%,70%,1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, hsla(343,100%,76%,1) 0px, transparent 50%);
            animation: mesh-shift 20s ease-in-out infinite alternate;
        }

        @keyframes mesh-shift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(255, 248, 247, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(174, 39, 93, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen overflow-hidden flex flex-col items-center justify-center relative select-none">
<!-- Layer 1: Atmospheric Background (Sunrise Gradient Mesh) -->
<div class="absolute inset-0 w-full h-full ambient-mesh z-0"></div>
<!-- Layer 2: Parallax Floating Nubes (Clouds) -->
<div class="absolute w-[80vw] h-[80vw] md:w-[40vw] md:h-[40vw] rounded-full bg-secondary-container opacity-30 blur-3xl z-10" style="top: 10%; left: -20%; animation: drift 30s linear infinite alternate, float 15s ease-in-out infinite;"></div>
<div class="absolute w-[60vw] h-[60vw] md:w-[30vw] md:h-[30vw] rounded-full bg-tertiary-fixed opacity-40 blur-[80px] z-10" style="bottom: -10%; right: -10%; animation: drift 40s linear infinite alternate-reverse, float 20s ease-in-out infinite 2s;"></div>
<!-- Layer 3: The Sun -->
<div class="absolute top-1/2 left-1/2 w-64 h-64 md:w-96 md:h-96 rounded-full bg-gradient-to-tr from-tertiary-fixed to-secondary-container z-20 mix-blend-screen" style="animation: breathe-sun 8s ease-in-out infinite;"></div>
<!-- Layer 4: Halo Effect behind Logo -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] border border-white/20 rounded-full z-20" style="animation: halo-spin 20s linear infinite;">
<div class="absolute top-0 left-1/2 w-4 h-4 bg-white rounded-full blur-[2px] shadow-[0_0_10px_white]"></div>
<div class="absolute bottom-0 right-1/4 w-2 h-2 bg-primary-fixed-dim rounded-full blur-[1px] shadow-[0_0_5px_rgba(255,177,197,1)]"></div>
</div>
<!-- Layer 5: Destellos (Sparkles) dynamically generated via JS -->
<div class="absolute inset-0 w-full h-full z-30 pointer-events-none" id="sparkle-container"></div>
<!-- Layer 6: Content Canvas (Brand Anchor) -->
<main class="relative z-40 flex flex-col items-center justify-center p-gutter w-full max-w-container-max mx-auto h-screen" style="animation: reveal-up 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;">
<div class="glass-panel px-12 py-16 rounded-[40px] flex flex-col items-center justify-center shadow-[0_20px_50px_rgba(174,39,93,0.05)] relative overflow-hidden group">
<!-- Subtle internal glow on hover -->
<div class="absolute inset-0 bg-gradient-to-b from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-1000"></div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter mb-4 text-glow relative z-10">
                FERNÉ
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant tracking-wide opacity-80 relative z-10" style="animation: reveal-up 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards; opacity: 0;">
                Tu día, a tu ritmo.
            </p>
<!-- Interactive Loading/Progress Indication -->
<div class="w-12 h-[2px] bg-outline-variant/30 mt-8 rounded-full overflow-hidden relative z-10" style="animation: reveal-up 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 1s forwards; opacity: 0;">
<div class="h-full bg-primary w-full origin-left scale-x-0 rounded-full" style="animation: load-progress 3s cubic-bezier(0.65, 0, 0.35, 1) infinite;"></div>
</div>
</div>
</main>
<style>
        @keyframes load-progress {
            0% { transform: scaleX(0); transform-origin: left; }
            49% { transform: scaleX(1); transform-origin: left; }
            50% { transform: scaleX(1); transform-origin: right; }
            100% { transform: scaleX(0); transform-origin: right; }
        }
    </style>
<script>
        // Micro-interaction: Dynamic Sparkle Generation
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('sparkle-container');
            const sparkleCount = 15;

            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                
                // Randomize positions, sizes, and animation delays
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const size = Math.random() * 4 + 2; // 2px to 6px
                const delay = Math.random() * 4;
                const duration = Math.random() * 2 + 2; // 2s to 4s

                sparkle.className = 'absolute rounded-full bg-white blur-[1px] shadow-[0_0_8px_rgba(255,255,255,0.8)]';
                sparkle.style.top = `${top}%`;
                sparkle.style.left = `${left}%`;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.animation = `sparkle-twinkle ${duration}s ease-in-out ${delay}s infinite`;

                container.appendChild(sparkle);
            }
        });
    </script>
</body></html>
